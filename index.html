<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOCODESTA NEXTGEN</title>
    <link rel="icon" sizes="192x192" href="MOCODESTA.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .ui-layer { position: absolute; z-index: 10; pointer-events: none; }
        .ui-interactive { pointer-events: auto; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #475569; border-radius: 2px; }
    </style>
</head>
<body class="text-white">

    <div id="canvas-container"></div>

    <div class="ui-layer ui-interactive top-0 w-full flex justify-between items-center p-2 glass-panel">
        <div class="flex items-center space-x-4 ml-2">
            <div class="bg-red-600 rounded p-1"><i class="fa-sharp fa-regular fa-square-m"></i></div>
            <h1 class="font-bold text-sm tracking-wide">MOCODESTA NEXT GENERATION<span class="text-xs font-normal text-gray-400"> Created by Rahmat Supriyanto</span></h1>
        </div>
        
        <div class="flex space-x-2 text-xs font-semibold">
            <button class="px-4 py-2 bg-blue-600 rounded shadow-[0_0_10px_rgba(37,99,235,0.5)]">360° GEO-OVERLAY</button>
            <div class="flex items-center space-x-2 px-3">
                <div id="sync-status" class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></div>
                <span id="sync-text" class="text-gray-300">WAITING GPS DATA</span>
            </div>
        </div>

        <div class="flex space-x-3 mr-2 text-sm">
            <label class="cursor-pointer px-4 py-2 bg-gray-800 rounded hover:bg-gray-700 transition flex items-center space-x-2">
                <i class="fas fa-camera"></i> <span>Foto 360 (UTM)</span>
                <input type="file" id="upload360" accept="image/*" class="hidden">
            </label>
            <label class="cursor-pointer px-4 py-2 bg-gray-800 border border-blue-500 rounded hover:bg-gray-700 transition flex items-center space-x-2">
                <i class="fas fa-file-alt"></i> <span>File .DXF (UTM)</span>
                <input type="file" id="uploadDXF" accept=".dxf" class="hidden">
            </label>
        </div>
    </div>

    <div class="ui-layer ui-interactive top-20 left-4 space-y-4">
        <div class="glass-panel p-3 rounded-lg text-xs space-y-1">
            <div class="text-blue-400 font-semibold mb-1"><i class="fas fa-map-marker-alt"></i> Status Georeference</div>
            <div id="info-drone-pos" class="text-gray-300">Drone Pos: Belum dimuat</div>
            <div id="info-dxf-pos" class="text-gray-300">DXF Anchor: Belum dimuat</div>
        </div>
    </div>

    <!-- Widget Kompas Mata Angin & Heading/Pitch -->
    <div class="ui-layer top-20 right-6 text-center">
        <div class="w-20 h-20 rounded-full glass-panel border-2 border-gray-600 flex items-center justify-center relative mb-2 mx-auto shadow-xl">
            <!-- Label Mata Angin Utama -->
            <span class="absolute top-1 text-[10px] font-bold text-red-400">U</span>
            <span class="absolute right-1 text-[10px] font-bold text-gray-400">T</span>
            <span class="absolute bottom-1 text-[10px] font-bold text-gray-400">S</span>
            <span class="absolute left-1 text-[10px] font-bold text-gray-400">B</span>
            
            <!-- Jarum Kompas -->
            <div id="compass-arrow" class="absolute w-1 h-10 bg-red-500 top-1.5 origin-bottom transform transition-transform duration-100 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></div>
            <div class="w-2 h-2 bg-white rounded-full z-10 shadow"></div>
        </div>
        <div class="text-xs font-mono bg-black/60 px-3 py-1.5 rounded-md backdrop-blur-sm border border-gray-700 shadow-lg">
            <div id="heading-val" class="font-bold text-blue-400">0° (U)</div>
            <div id="pitch-val" class="text-gray-400 mt-0.5">Pitch: 0°</div>
        </div>
    </div>

    <div class="ui-layer ui-interactive bottom-8 left-1/2 transform -translate-x-1/2 glass-panel rounded-full px-6 py-3 flex items-center space-x-6 w-3/4 max-w-4xl text-xs">
        <div class="flex-1 flex items-center space-x-3">
            <span class="text-gray-400 font-semibold w-12">Tinggi Z:</span>
            <input type="range" id="sliderZ" min="-100" max="100" value="0" step="0.5">
            <span id="valZ" class="w-16 text-right font-mono">0.00m</span>
        </div>

        <div class="flex-1 flex items-center space-x-3">
            <span class="text-gray-400 font-semibold w-14">Rotasi:</span>
            <input type="range" id="sliderRot" min="-180" max="180" value="0">
            <span id="valRot" class="w-12 text-right font-mono">0.0°</span>
        </div>

        <div class="flex-1 flex items-center space-x-3">
            <span class="text-gray-400 font-semibold w-12">Skala:</span>
            <input type="range" id="sliderScale" min="0.1" max="5" step="0.01" value="1">
            <span id="valScale" class="w-12 text-right font-mono">1.00x</span>
        </div>

        <button id="btnReset" class="flex flex-col items-center text-gray-400 hover:text-white transition">
            <i class="fas fa-crosshairs mb-1"></i>
            <span style="font-size: 0.6rem;">Reset</span>
        </button>
    </div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>

    <script>
        // Setup Three.js Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 0.1);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.1; 
        controls.maxDistance = 1000;  

        // Panorama 360 Sphere
        const sphereGeometry = new THREE.SphereGeometry(500, 60, 40);
        sphereGeometry.scale(-1, 1, 1); 
        const textureLoader = new THREE.TextureLoader();
        const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0x1e293b, wireframe: true }); 
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(sphere);

        // DXF Group Container
        const dxfGroup = new THREE.Group();
        scene.add(dxfGroup);

        let droneUTM = { x: null, y: null };
        let rawDxfData = null;
        let dxfAnchor = { x: 0, y: 0 };

        function convertDMSToDeg(dms, ref) {
            if (!dms) return 0;
            let floatDeg = dms[0] + dms[1] / 60 + dms[2] / 3600;
            if (ref === "S" || ref === "W") floatDeg *= -1;
            return floatDeg;
        }

        function getUTMProjString(lon) {
            let zone = Math.floor((lon + 180) / 6) + 1;
            return `+proj=utm +zone=${zone} +south +ellps=WGS84 +datum=WGS84 +units=m +no_defs`;
        }

        // Helper untuk Konversi Derajat ke Nama Mata Angin
        function getCardinalDirection(angle) {
            const directions = ['U', 'TL', 'T', 'TG', 'S', 'BD', 'B', 'BL'];
            const index = Math.round((angle % 360) / 45);
            return directions[index % 8];
        }

        // Upload Foto 360 & Ekstrak GPS EXIF
        document.getElementById('upload360').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                textureLoader.load(e.target.result, function(texture) {
                    sphere.material.dispose();
                    sphere.material = new THREE.MeshBasicMaterial({ map: texture });
                });
            };
            reader.readAsDataURL(file);

            EXIF.getData(file, function() {
                const latTag = EXIF.getTag(this, "GPSLatitude");
                const latRef = EXIF.getTag(this, "GPSLatitudeRef");
                const lonTag = EXIF.getTag(this, "GPSLongitude");
                const lonRef = EXIF.getTag(this, "GPSLongitudeRef");

                if (latTag && lonTag) {
                    const lat = convertDMSToDeg(latTag, latRef);
                    const lon = convertDMSToDeg(lonTag, lonRef);
                    
                    const utmProj = getUTMProjString(lon);
                    const coords = proj4('EPSG:4326', utmProj, [lon, lat]);
                    
                    droneUTM = { x: coords[0], y: coords[1] };
                    
                    document.getElementById('info-drone-pos').innerText = `Drone UTM: X=${droneUTM.x.toFixed(1)}, Y=${droneUTM.y.toFixed(1)}`;
                    document.getElementById('sync-status').className = "w-2 h-2 bg-green-500 rounded-full animate-pulse";
                    document.getElementById('sync-text').innerText = "GPS SYNCED";

                    if (rawDxfData) processAndRenderDXF(rawDxfData);
                } else {
                    alert("Metadata GPS EXIF tidak ditemukan pada foto 360 ini. Menggunakan titik referensi default (0,0).");
                    droneUTM = { x: 0, y: 0 };
                    if (rawDxfData) processAndRenderDXF(rawDxfData);
                }
            });
        });

        // Upload DXF
        document.getElementById('uploadDXF').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parser = new DxfParser();
                    rawDxfData = parser.parseSync(e.target.result);
                    processAndRenderDXF(rawDxfData);
                } catch (err) {
                    alert("Gagal memparsing file DXF.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        });

        // ============================================================
        // DXF RENDER ENGINE
        // - membaca warna entity (TrueColor / ACI / ByLayer)
        // - membaca TEXT & MTEXT
        // - LINE / POLYLINE / LWPOLYLINE
        // - ARC / CIRCLE / ELLIPSE
        // - memakai Z dari DXF bila tersedia
        // - mendukung INSERT sederhana (block reference)
        // ============================================================

        const ACI_COLORS = {
            1: 0xFF0000, 2: 0xFFFF00, 3: 0x00FF00, 4: 0x00FFFF,
            5: 0x0000FF, 6: 0xFF00FF, 7: 0xFFFFFF, 8: 0x414141,
            9: 0x808080, 10: 0xFF0000, 11: 0xFF7F7F, 12: 0xA50000,
            13: 0xA55050, 14: 0xA50000, 15: 0xA55050, 16: 0x7F0000,
            17: 0x7F3F3F, 18: 0xFF3F00, 19: 0xFF9F7F, 20: 0xA52A00,
            21: 0xA5523F, 22: 0x7F1F00, 23: 0x7F4F3F, 30: 0xFF7F00,
            31: 0xFFBF7F, 32: 0xA55200, 33: 0xA57A3F, 34: 0x7F3F00,
            35: 0x7F5F3F, 40: 0xFFBF00, 41: 0xFFDF7F, 42: 0xA57A00,
            43: 0xA5903F, 44: 0x7F5F00, 45: 0x7F6F3F, 50: 0xFFFF00,
            51: 0xFFFF7F, 52: 0xA5A500, 53: 0xA5A53F, 54: 0x7F7F00,
            55: 0x7F7F3F, 60: 0x7FFF00, 61: 0xBFFF7F, 62: 0x7FA500,
            63: 0x90A53F, 64: 0x5F7F00, 65: 0x6F7F3F, 70: 0x00FF00,
            71: 0x7FFF7F, 72: 0x00A500, 73: 0x3FA53F, 74: 0x007F00,
            75: 0x3F7F3F, 80: 0x00FF7F, 81: 0x7FFFBF, 82: 0x00A57F,
            83: 0x3FA57A, 84: 0x007F5F, 85: 0x3F7F6F, 90: 0x00FFFF,
            91: 0x7FFFFF, 92: 0x00A5A5, 93: 0x3FA5A5, 94: 0x007F7F,
            95: 0x3F7F7F, 100: 0x007FFF, 101: 0x7FBFFF, 102: 0x007FA5,
            103: 0x3F7FA5, 104: 0x005F7F, 105: 0x3F6F7F, 110: 0x0000FF,
            111: 0x7F7FFF, 112: 0x0000A5, 113: 0x3F3FA5, 114: 0x00007F,
            115: 0x3F3F7F, 120: 0x7F00FF, 121: 0xBF7FFF, 122: 0x7F00A5,
            123: 0x7F3FA5, 124: 0x3F007F, 125: 0x5F3F7F, 130: 0xFF00FF,
            131: 0xFF7FFF, 132: 0xA500A5, 133: 0xA53FA5, 134: 0x7F007F,
            135: 0x7F3F7F, 140: 0xFF007F, 141: 0xFF7FBF, 142: 0xA5007F,
            143: 0xA53F7F, 144: 0x7F005F, 145: 0x7F3F6F, 150: 0xFF0000,
            151: 0xFF7F7F, 152: 0xA50000, 153: 0xA53F3F, 154: 0x7F0000,
            155: 0x7F3F3F, 256: 0xFFFFFF, 257: 0xFFFFFF
        };

        function getLayerInfo(dxf, layerName) {
            const layers = dxf && dxf.tables && dxf.tables.layer && dxf.tables.layer.layers;
            return (layers && layerName && layers[layerName]) ? layers[layerName] : null;
        }

        function colorFromDXF(ent, dxf) {
            // dxf-parser 1.1.2 stores true color (420) directly in ent.color.
            // ACI (62) is stored as an RGB integer by the parser.
            const raw = ent && ent.color;

            if (typeof raw === 'number' && Number.isFinite(raw)) {
                // TrueColor: already 0xRRGGBB
                if (raw >= 0 && raw <= 0xFFFFFF) return raw;
            }

            const layer = getLayerInfo(dxf, ent && ent.layer);

            // 256 = BYLAYER, 0 = BYBLOCK
            if (!raw || ent.colorIndex === 256 || ent.colorIndex === 0) {
                if (layer && typeof layer.color === 'number' && layer.color >= 0) {
                    return layer.color & 0xFFFFFF;
                }
                if (layer && layer.colorIndex && ACI_COLORS[layer.colorIndex]) {
                    return ACI_COLORS[layer.colorIndex];
                }
            }

            const idx = Math.abs(Number(ent && ent.colorIndex));
            if (ACI_COLORS[idx]) return ACI_COLORS[idx];

            // Fallback berdasarkan layer, kemudian putih.
            if (layer && typeof layer.color === 'number') return layer.color & 0xFFFFFF;
            return 0xFFFFFF;
        }

        function cleanMText(value) {
            if (value == null) return "";
            return String(value)
                .replace(/\\P/gi, "\n")
                .replace(/\\~|\\ /g, " ")
                .replace(/\\[A-Za-z][^;]*;/g, "")
                .replace(/\{|\}/g, "")
                .replace(/\^\s*J/g, "\n")
                .trim();
        }

        // DXF -> Three.js coordinate conversion.
        // IMPORTANT: DXF coordinates are stored in WCS/OCS depending on entity.
        // We first resolve the entity point to WCS, then convert WCS(X,Y,Z) to
        // Three.js(X,Z,-Y). This preserves XYZ instead of treating every
        // vertex as a flat XY point.
        function normalizeVec3(v, fallback) {
            const x = Number(v && v.x), y = Number(v && v.y), z = Number(v && v.z);
            const out = new THREE.Vector3(
                Number.isFinite(x) ? x : fallback.x,
                Number.isFinite(y) ? y : fallback.y,
                Number.isFinite(z) ? z : fallback.z
            );
            if (out.lengthSq() < 1e-24) return fallback.clone();
            return out.normalize();
        }

        function getEntityNormal(ent) {
            const e = ent && (ent.extrusionDirection || ent.extrusion || ent.normal);
            return normalizeVec3(e, new THREE.Vector3(0, 0, 1));
        }

        // Build the AutoCAD Arbitrary Axis System (OCS -> WCS).
        function ocsBasis(normal) {
            const n = normalizeVec3(normal, new THREE.Vector3(0, 0, 1));
            let ax;
            if (Math.abs(n.x) < 1 / 64 && Math.abs(n.y) < 1 / 64) {
                ax = new THREE.Vector3(0, 1, 0).cross(n).normalize();
            } else {
                ax = new THREE.Vector3(0, 0, 1).cross(n).normalize();
            }
            const ay = n.clone().cross(ax).normalize();
            return { xAxis: ax, yAxis: ay, zAxis: n };
        }

        function ocsToWcs(v, normal) {
            const b = ocsBasis(normal);
            const x = Number(v && v.x) || 0;
            const y = Number(v && v.y) || 0;
            const z = Number(v && v.z) || 0;
            return b.xAxis.clone().multiplyScalar(x)
                .add(b.yAxis.clone().multiplyScalar(y))
                .add(b.zAxis.clone().multiplyScalar(z));
        }

        function pointToThree(v, anchorX, anchorY, zOverride = null) {
            return new THREE.Vector3(
                Number(v && v.x || 0) - anchorX,
                Number(zOverride == null ? (v && v.z || 0) : zOverride),
                -(Number(v && v.y || 0) - anchorY)
            );
        }

        function entityPointToWcs(ent, v, options = {}) {
            const type = String(ent && ent.type || '').toUpperCase();
            let p = {
                x: Number(v && v.x) || 0,
                y: Number(v && v.y) || 0,
                z: Number(v && v.z) || 0
            };

            // LWPOLYLINE vertex coordinates are OCS. Its elevation is the
            // entity-wide Z when the vertex itself has no Z value.
            if (type === 'LWPOLYLINE') {
                const elevation = Number(ent.elevation);
                if (Number.isFinite(elevation) && !Number.isFinite(Number(v && v.z))) {
                    p.z = elevation;
                }
                const ex = ent.extrusionDirection || ent.extrusion;
                if (ex) return ocsToWcs(p, ex);
                // Default OCS normal is +Z, so this is already WCS.
                return p;
            }

            // 2D POLYLINE vertex data is OCS; 3D POLYLINE is WCS.
            if (type === 'POLYLINE' && !(Number(ent.flags || 0) & 8)) {
                const elevation = Number(ent.elevation && (ent.elevation.z != null ? ent.elevation.z : ent.elevation));
                if (Number.isFinite(elevation) && !Number.isFinite(Number(v && v.z))) p.z = elevation;
                const ex = ent.extrusionDirection || ent.extrusion;
                if (ex) return ocsToWcs(p, ex);
                return p;
            }

            // ARC/CIRCLE/ELLIPSE are defined in an OCS when an extrusion
            // direction is supplied.
            if (options.applyOCS && (ent.extrusionDirection || ent.extrusion)) {
                return ocsToWcs(p, ent.extrusionDirection || ent.extrusion);
            }
            return p;
        }

        function entityPointToThree(ent, v, anchorX, anchorY, options = {}) {
            return pointToThree(entityPointToWcs(ent, v, options), anchorX, anchorY);
        }

        function addLine(points, color, parent = dxfGroup, closed = false) {
            if (!points || points.length < 2) return null;

            const pts = points.slice();
            if (closed && pts.length > 2) {
                const a = pts[0], b = pts[pts.length - 1];
                if (a.distanceToSquared(b) > 1e-12) pts.push(a.clone());
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(pts);
            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.98,
                depthTest: false
            });
            const line = new THREE.Line(geometry, material);
            line.renderOrder = 10;
            parent.add(line);
            return line;
        }

        function arcPoints(cx, cy, cz, radius, startDeg, endDeg, anchorX, anchorY, segments = 64) {
            let a0 = THREE.MathUtils.degToRad(startDeg);
            let a1 = THREE.MathUtils.degToRad(endDeg);
            while (a1 < a0) a1 += Math.PI * 2;

            const pts = [];
            const count = Math.max(8, Math.ceil(Math.abs(a1 - a0) / (Math.PI / 24)));
            for (let i = 0; i <= Math.min(segments * 4, count); i++) {
                const t = i / Math.min(segments * 4, count);
                const a = a0 + (a1 - a0) * t;
                pts.push(new THREE.Vector3(
                    cx + Math.cos(a) * radius - anchorX,
                    cz,
                    -(cy + Math.sin(a) * radius - anchorY)
                ));
            }
            return pts;
        }

        function makeTextSprite(text, color, height, rotation = 0) {
            text = cleanMText(text);
            if (!text) return null;

            const lines = text.split(/\r?\n/);
            const fontPx = 96;
            const linePx = 112;
            const padding = 24;
            const longest = lines.reduce((m, x) => Math.max(m, x.length), 1);
            const widthPx = Math.max(128, longest * fontPx * 0.62 + padding * 2);
            const heightPx = Math.max(128, lines.length * linePx + padding * 2);

            const canvas = document.createElement("canvas");
            canvas.width = Math.ceil(widthPx);
            canvas.height = Math.ceil(heightPx);

            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = `600 ${fontPx}px "Segoe UI", Arial, sans-serif`;
            ctx.textBaseline = "top";
            ctx.textAlign = "left";

            const c = new THREE.Color(color);
            ctx.fillStyle = `rgb(${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)})`;

            lines.forEach((line, i) => {
                ctx.fillText(line, padding, padding + i * linePx);
            });

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false,
                depthWrite: false
            });

            const sprite = new THREE.Sprite(material);
            const worldHeight = Math.max(Number(height) || 1, 0.01);
            const aspect = canvas.width / canvas.height;
            sprite.scale.set(worldHeight * aspect, worldHeight, 1);
            sprite.rotation = THREE.MathUtils.degToRad(Number(rotation) || 0);
            sprite.renderOrder = 100;

            sprite.userData.dxfText = text;
            sprite.userData.dxfHeight = worldHeight;
            return sprite;
        }

        function renderTextEntity(ent, color, anchorX, anchorY, parent = dxfGroup) {
            const p = ent.startPoint || ent.position || ent.insertionPoint;
            if (!p) return;

            const text = ent.text || ent.value || ent.string;
            if (!text) return;

            const sprite = makeTextSprite(
                text,
                color,
                ent.textHeight || ent.height || 1,
                ent.rotation || 0
            );
            if (!sprite) return;

            const pos = pointToThree(p, anchorX, anchorY);
            sprite.position.copy(pos);
            parent.add(sprite);
        }

        // Build an AutoCAD-like polyline path. DXF LWPOLYLINE/POLYLINE vertices
        // may contain a `bulge` value; treating every vertex pair as a straight
        // segment makes curved corners look disconnected/misaligned.
        function buildPolylinePoints(ent, vertices, closed, anchorX, anchorY) {
            if (!Array.isArray(vertices) || vertices.length < 2) return [];

            const pts = [];
            const count = closed ? vertices.length : vertices.length - 1;

            for (let i = 0; i < count; i++) {
                const a = vertices[i];
                const b = vertices[(i + 1) % vertices.length];
                const aw = entityPointToWcs(ent, a);
                const bw = entityPointToWcs(ent, b);
                const a3 = pointToThree(aw, anchorX, anchorY);
                const b3 = pointToThree(bw, anchorX, anchorY);

                if (i === 0) pts.push(a3);

                const bulge = Number(a.bulge);
                if (!Number.isFinite(bulge) || Math.abs(bulge) < 1e-12) {
                    pts.push(b3);
                    continue;
                }

                // Bulge is defined in the polyline OCS. Build the arc in OCS,
                // then transform every generated point to WCS. This avoids the
                // old bug where XY was reconstructed in WCS and Z was mixed in.
                const x1 = Number(a.x) || 0, y1 = Number(a.y) || 0;
                const x2 = Number(b.x) || 0, y2 = Number(b.y) || 0;
                const dx = x2 - x1, dy = y2 - y1;
                const chord = Math.hypot(dx, dy);
                if (chord < 1e-12) { pts.push(b3); continue; }

                const theta = 4 * Math.atan(bulge);
                const radius = (chord / 2) * (1 + bulge * bulge) / (2 * Math.abs(bulge));
                const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
                const nx = -dy / chord, ny = dx / chord;
                const offset = (chord / 2) * (1 - bulge * bulge) / (2 * bulge);
                const cx = midX + nx * offset;
                const cy = midY + ny * offset;
                const startAngle = Math.atan2(y1 - cy, x1 - cx);
                const steps = Math.max(4, Math.ceil(Math.abs(theta) / (Math.PI / 36)));
                const elevationA = Number(aw.z) || 0;
                const elevationB = Number(bw.z) || elevationA;
                const normal = ent.extrusionDirection || ent.extrusion || {x:0,y:0,z:1};

                for (let j = 1; j <= steps; j++) {
                    const t = j / steps;
                    const ang = startAngle + theta * t;
                    const ocsPoint = {
                        x: cx + Math.cos(ang) * radius,
                        y: cy + Math.sin(ang) * radius,
                        z: elevationA + (elevationB - elevationA) * t
                    };
                    const w = ocsToWcs(ocsPoint, normal);
                    pts.push(pointToThree(w, anchorX, anchorY));
                }
            }
            return pts;
        }

        function getEntityVertices(ent) {
            if (Array.isArray(ent.vertices)) return ent.vertices;
            if (ent.startPoint && ent.endPoint) return [ent.startPoint, ent.endPoint];
            return [];
        }

        function renderDXFEntity(ent, dxf, anchorX, anchorY, parent = dxfGroup, depth = 0) {
            if (!ent || ent.visible === false) return;
            if (depth > 8) return; // protect against malformed recursive blocks

            const color = colorFromDXF(ent, dxf);
            const type = String(ent.type || "").toUpperCase();

            // LINE / POLYLINE / LWPOLYLINE
            if (type === "LINE" || type === "POLYLINE" || type === "LWPOLYLINE") {
                const vertices = getEntityVertices(ent);
                if (vertices.length >= 2) {
                    // AutoCAD's closed flag can be exposed by different parser
                    // versions as closed, shape or bit 1 in flags.
                    const closed = !!(ent.closed || ent.shape || ((Number(ent.flags) || 0) & 1));
                    const pts = (type === "LINE")
                        ? vertices.map(v => entityPointToThree(ent, v, anchorX, anchorY))
                        : buildPolylinePoints(ent, vertices, closed, anchorX, anchorY);

                    // buildPolylinePoints already includes the closing segment.
                    addLine(pts, color, parent, false);
                }
                return;
            }

            // 3D POLYLINE can also expose vertices with z.
            if (type === "3DPOLYLINE") {
                const pts = getEntityVertices(ent).map(v => entityPointToThree(ent, v, anchorX, anchorY));
                addLine(pts, color, parent, !!ent.closed);
                return;
            }

            // ARC
            if (type === "ARC") {
                const c = ent.center || ent.startPoint;
                const radius = Number(ent.radius || 0);
                if (c && radius > 0) {
                    addLine(
                        arcPoints(
                            Number(c.x || 0), Number(c.y || 0), Number(c.z || 0),
                            radius,
                            Number(ent.startAngle || 0),
                            Number(ent.endAngle || 0),
                            anchorX, anchorY
                        ),
                        color,
                        parent
                    );
                }
                return;
            }

            // CIRCLE
            if (type === "CIRCLE") {
                const c = ent.center;
                const radius = Number(ent.radius || 0);
                if (c && radius > 0) {
                    addLine(
                        arcPoints(
                            Number(c.x || 0), Number(c.y || 0), Number(c.z || 0),
                            radius, 0, 360, anchorX, anchorY, 96
                        ),
                        color,
                        parent,
                        true
                    );
                }
                return;
            }

            // ELLIPSE - approximate using major axis and ratio.
            if (type === "ELLIPSE") {
                const c = ent.center;
                const major = ent.majorAxisEndPoint || ent.majorAxis || ent.majorAxisVector;
                if (c && major) {
                    const mx = Number(major.x || 0);
                    const my = Number(major.y || 0);
                    const mz = Number(major.z || 0);
                    const majorLen = Math.hypot(mx, my, mz);
                    const ratio = Number(ent.axisRatio || ent.ratio || 1);
                    if (majorLen > 0) {
                        const pts = [];
                        const start = Number(ent.startAngle || 0);
                        const end = Number(ent.endAngle == null ? Math.PI * 2 : ent.endAngle);
                        const isRadians = Math.abs(end) <= Math.PI * 2 + 0.01 && Math.abs(start) <= Math.PI * 2 + 0.01;
                        const a0 = isRadians ? start : THREE.MathUtils.degToRad(start);
                        const a1 = isRadians ? end : THREE.MathUtils.degToRad(end);
                        const count = 96;
                        for (let i = 0; i <= count; i++) {
                            const t = i / count;
                            const a = a0 + (a1 - a0) * t;
                            const ux = mx / majorLen, uy = my / majorLen;
                            const vx = -uy, vy = ux;
                            const x = Number(c.x || 0) + mx * Math.cos(a) + vx * majorLen * ratio * Math.sin(a);
                            const y = Number(c.y || 0) + my * Math.cos(a) + vy * majorLen * ratio * Math.sin(a);
                            pts.push(new THREE.Vector3(x - anchorX, Number(c.z || 0), -(y - anchorY)));
                        }
                        addLine(pts, color, parent, Math.abs((a1 - a0) - Math.PI * 2) < 0.01);
                    }
                }
                return;
            }

            // TEXT / MTEXT
            if (type === "TEXT" || type === "MTEXT" || type === "ATTRIB" || type === "ATTDEF") {
                renderTextEntity(ent, color, anchorX, anchorY, parent);
                return;
            }

            // POINT - render as a small crosshair.
            if (type === "POINT") {
                const p = ent.position || ent.startPoint;
                if (p) {
                    const q = pointToThree(p, anchorX, anchorY);
                    const s = 0.15;
                    addLine([
                        q.clone().add(new THREE.Vector3(-s, 0, 0)),
                        q.clone().add(new THREE.Vector3(s, 0, 0))
                    ], color, parent);
                    addLine([
                        q.clone().add(new THREE.Vector3(0, 0, -s)),
                        q.clone().add(new THREE.Vector3(0, 0, s))
                    ], color, parent);
                }
                return;
            }

            // INSERT - render referenced BLOCK entities.
            if (type === "INSERT") {
                const blockName = ent.name || ent.block || ent.blockName;
                const block = dxf.blocks && blockName ? dxf.blocks[blockName] : null;
                const ip = ent.position || ent.insertionPoint || ent.startPoint;
                if (block && Array.isArray(block.entities) && ip) {
                    const g = new THREE.Group();
                    const ins = pointToThree(ip, anchorX, anchorY);
                    g.position.copy(ins);
                    g.rotation.y = THREE.MathUtils.degToRad(Number(ent.rotation || 0));
                    const sx = Number(ent.xScale == null ? 1 : ent.xScale);
                    const sy = Number(ent.yScale == null ? 1 : ent.yScale);
                    const sz = Number(ent.zScale == null ? 1 : ent.zScale);
                    g.scale.set(sx, sz, sy);
                    parent.add(g);

                    // Block coordinates are local, so use a zero anchor for block content.
                    block.entities.forEach(child => {
                        renderDXFEntity(child, dxf, 0, 0, g, depth + 1);
                    });
                }
                return;
            }

            // SPLINE fallback: use fit points/control points if parser exposes them.
            if (type === "SPLINE") {
                const ptsRaw = ent.fitPoints || ent.controlPoints || ent.vertices || [];
                if (ptsRaw.length >= 2) {
                    addLine(ptsRaw.map(v => pointToThree(v, anchorX, anchorY)), color, parent);
                }
                return;
            }

            // Generic fallback for unsupported entities exposing vertices.
            const fallback = getEntityVertices(ent);
            if (fallback.length >= 2) {
                addLine(fallback.map(v => pointToThree(v, anchorX, anchorY)), color, parent, !!ent.closed);
            }
        }

        function collectDxfBounds(dxf) {
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            const inspect = (ent, depth = 0) => {
                if (!ent || depth > 8) return;

                const candidates = [];
                if (Array.isArray(ent.vertices)) candidates.push(...ent.vertices);
                if (ent.startPoint) candidates.push(ent.startPoint);
                if (ent.endPoint) candidates.push(ent.endPoint);
                if (ent.position) candidates.push(ent.position);
                if (ent.insertionPoint) candidates.push(ent.insertionPoint);
                if (ent.center) candidates.push(ent.center);

                candidates.forEach(v => {
                    if (!v) return;
                    const x = Number(v.x), y = Number(v.y);
                    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x);
                    minY = Math.min(minY, y);
                    maxY = Math.max(maxY, y);
                });

                // Include INSERT insertion point.
                if (String(ent.type).toUpperCase() === "INSERT") {
                    const block = dxf.blocks && dxf.blocks[ent.name];
                    if (block && Array.isArray(block.entities)) {
                        block.entities.forEach(child => inspect(child, depth + 1));
                    }
                }
            };

            (dxf.entities || []).forEach(e => inspect(e));
            return { minX, maxX, minY, maxY };
        }

        function buildDXFTopology(dxf, bounds) {
            // CAD viewers do not render every LINE with an unrelated coordinate
            // system.  Endpoints that are numerically equal (or differ only by
            // tiny CAD export precision) are treated as the same topological
            // vertex. This prevents visible micro-gaps between LINE/POLYLINEs.
            const span = Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY, 1);
            const tolerance = Math.max(1e-7 * span, 1e-6);
            const buckets = new Map();

            function key(v) {
                const x = Number(v.x || 0), y = Number(v.y || 0), z = Number(v.z || 0);
                return `${Math.round(x / tolerance)},${Math.round(y / tolerance)},${Math.round(z / tolerance)}`;
            }

            function snap(v) {
                if (!v || !Number.isFinite(Number(v.x)) || !Number.isFinite(Number(v.y))) return v;
                const k = key(v);
                let c = buckets.get(k);
                if (!c) {
                    c = { x: Number(v.x), y: Number(v.y), z: Number(v.z || 0) };
                    buckets.set(k, c);
                }
                return c;
            }

            function visit(ent, depth = 0) {
                if (!ent || depth > 12) return;
                const type = String(ent.type || '').toUpperCase();
                if (Array.isArray(ent.vertices) &&
                    (type === 'LINE' || type === 'POLYLINE' || type === 'LWPOLYLINE' || type === '3DPOLYLINE')) {
                    ent.vertices = ent.vertices.map(v => snap(v));
                }
                if (ent.startPoint) ent.startPoint = snap(ent.startPoint);
                if (ent.endPoint) ent.endPoint = snap(ent.endPoint);
                if (ent.position) ent.position = snap(ent.position);
                if (ent.insertionPoint) ent.insertionPoint = snap(ent.insertionPoint);
                if (ent.center) ent.center = snap(ent.center);
                if (type === 'INSERT') {
                    const block = dxf.blocks && dxf.blocks[ent.name];
                    if (block && Array.isArray(block.entities)) block.entities.forEach(e => visit(e, depth + 1));
                }
            }
            (dxf.entities || []).forEach(e => visit(e));
            return { tolerance, vertexCount: buckets.size };
        }

        function processAndRenderDXF(dxf) {
            while (dxfGroup.children.length > 0) {
                const child = dxfGroup.children.pop();
                child.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (obj.material.map) obj.material.map.dispose();
                        obj.material.dispose();
                    }
                });
            }

            if (!dxf || !Array.isArray(dxf.entities)) {
                alert('DXF tidak memiliki entity yang dapat dibaca.');
                return;
            }

            const bounds = collectDxfBounds(dxf);
            if (!Number.isFinite(bounds.minX) || !Number.isFinite(bounds.minY)) {
                alert('DXF berhasil diparse, tetapi tidak ditemukan koordinat geometry.');
                return;
            }

            dxfAnchor.x = (droneUTM.x !== null) ? droneUTM.x : (bounds.minX + bounds.maxX) / 2;
            dxfAnchor.y = (droneUTM.y !== null) ? droneUTM.y : (bounds.minY + bounds.maxY) / 2;

            // Do NOT mutate/snap source coordinates. CAD coordinates are authoritative;
            // changing them here can create incorrect XYZ positions. We only collect
            // connectivity diagnostics and render the original coordinates.

            document.getElementById('info-dxf-pos').innerText =
                `DXF Anchor: X=${dxfAnchor.x.toFixed(1)}, Y=${dxfAnchor.y.toFixed(1)}`;

            const stats = {};
            dxf.entities.forEach(ent => {
                const type = String(ent.type || 'UNKNOWN').toUpperCase();
                stats[type] = (stats[type] || 0) + 1;
                renderDXFEntity(ent, dxf, dxfAnchor.x, dxfAnchor.y);
            });

            const statText = Object.entries(stats).map(([k, v]) => `${k}: ${v}`).join(' | ');
            console.info('DXF loaded:', { entities: dxf.entities.length, bounds, anchor: dxfAnchor, types: stats });

            document.getElementById('sync-text').innerText = `DXF LOADED • ${dxf.entities.length} ENTITIES`;
            document.getElementById('sync-status').className = 'w-2 h-2 bg-green-500 rounded-full animate-pulse';

            if (droneUTM.x === null) {
                const span = Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY, 1);
                controls.target.set(0, 0, 0);
                camera.position.set(0, Math.max(span * 0.8, 20), Math.max(span * 0.8, 20));
                controls.update();
            }
            console.info('DXF entity summary:', statText);
        }
        
        // Kontrol Interaktif Slider
        const sliderZ = document.getElementById('sliderZ');
        const sliderRot = document.getElementById('sliderRot');
        const sliderScale = document.getElementById('sliderScale');

        function updateTransform() {
            dxfGroup.position.y = parseFloat(sliderZ.value);
            document.getElementById('valZ').innerText = parseFloat(sliderZ.value).toFixed(2) + "m";

            const rot = parseFloat(sliderRot.value);
            dxfGroup.rotation.y = THREE.MathUtils.degToRad(rot);
            document.getElementById('valRot').innerText = (rot > 0 ? '+' : '') + rot.toFixed(1) + "°";

            const scale = parseFloat(sliderScale.value);
            dxfGroup.scale.set(scale, scale, scale);
            document.getElementById('valScale').innerText = scale.toFixed(2) + "x";
        }

        sliderZ.addEventListener('input', updateTransform);
        sliderRot.addEventListener('input', updateTransform);
        sliderScale.addEventListener('input', updateTransform);

        document.getElementById('btnReset').addEventListener('click', () => {
            sliderZ.value = 0; sliderRot.value = 0; sliderScale.value = 1;
            updateTransform();
        });

        // Loop Animasi & Kompas Real-time
        const compassArrow = document.getElementById('compass-arrow');
        const headingVal = document.getElementById('heading-val');
        const pitchVal = document.getElementById('pitch-val');

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Bearing kamera dihitung dari arah pandang (camera -> target),
            // dengan konvensi peta: Utara=0°, Timur=90°, Selatan=180°, Barat=270°.
            // Pada scene ini sumbu Three.js: +X = Timur dan -Z = Utara.
            // Rumus lama memakai posisi camera terhadap target sehingga arah Timur/Barat
            // menjadi terbalik setelah panorama + DXF dimuat.
            const dirX = controls.target.x - camera.position.x;
            const dirZ = controls.target.z - camera.position.z;
            const heading = (THREE.MathUtils.radToDeg(Math.atan2(dirX, -dirZ)) + 360) % 360;
            
            // Putar jarum kompas searah jarum jam dari Utara.
            compassArrow.style.transform = `rotate(${heading}deg)`;
            
            // Update teks heading beserta keterangan mata angin (U, TL, T, TG, S, BD, B, BL)
            const cardinal = getCardinalDirection(heading);
            headingVal.innerText = `${Math.round(heading)}° (${cardinal})`;
            
            // Hitung nilai pitch kamera
            const pitch = THREE.MathUtils.radToDeg(camera.rotation.x);
            pitchVal.innerText = `Pitch: ${Math.round(pitch)}°`;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
